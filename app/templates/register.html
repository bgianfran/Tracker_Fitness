<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Crear cuenta — FitTracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <style>input { font-size: 16px !important; }</style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex items-center justify-center px-4 py-8">
  <div class="w-full max-w-sm space-y-6">

    <!-- Logo -->
    <div class="text-center space-y-2">
      <div class="flex items-center justify-center gap-2">
        <svg class="w-8 h-8 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
        <span class="text-2xl font-bold text-emerald-400">FitTracker</span>
      </div>
      <p class="text-gray-400 text-sm">Creá tu cuenta y empezá a trackear</p>
    </div>

    <!-- Card -->
    <div class="bg-gray-800 border border-gray-700 rounded-2xl p-6 space-y-5">
      <h1 class="text-xl font-bold text-white text-center">Crear cuenta</h1>

      {% if error %}
      <div class="bg-red-900/40 border border-red-700/50 rounded-xl px-4 py-3 text-sm text-red-300">
        {{ error }}
      </div>
      {% endif %}

      <form action="/register" method="post" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1.5">Nombre</label>
          <input type="text" name="name" required autocomplete="name"
            placeholder="Tu nombre"
            class="w-full bg-gray-700 border border-gray-600 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-emerald-400 focus:ring-1 focus:ring-emerald-400"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1.5">Email</label>
          <input type="email" name="email" required autocomplete="email"
            placeholder="tu@email.com"
            class="w-full bg-gray-700 border border-gray-600 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-emerald-400 focus:ring-1 focus:ring-emerald-400"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1.5">Contraseña</label>
          <input type="password" name="password" required autocomplete="new-password"
            placeholder="Mínimo 6 caracteres"
            class="w-full bg-gray-700 border border-gray-600 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-emerald-400 focus:ring-1 focus:ring-emerald-400"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1.5">Repetir contraseña</label>
          <input type="password" name="password_confirm" required autocomplete="new-password"
            placeholder="••••••••"
            class="w-full bg-gray-700 border border-gray-600 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-emerald-400 focus:ring-1 focus:ring-emerald-400"/>
        </div>
        <button type="submit"
          class="w-full bg-emerald-500 hover:bg-emerald-600 active:bg-emerald-700 text-white font-bold py-3 rounded-xl transition-colors">
          Crear cuenta
        </button>
      </form>
    </div>

    <p class="text-center text-sm text-gray-400">
      ¿Ya tenés cuenta?
      <a href="/login" class="text-emerald-400 hover:text-emerald-300 font-medium">Iniciá sesión</a>
    </p>
  </div>
</body>
</html>
