<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Fitness Tracker{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50:  '#ecfdf5',
              100: '#d1fae5',
              200: '#a7f3d0',
              300: '#6ee7b7',
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #1f2937; }
    ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #4b5563; }

    /* Progress bar transition */
    .progress-bar { transition: width 0.6s ease; }

    /* Smooth page transitions */
    body { opacity: 1; transition: opacity 0.15s ease; }

    /* Active nav link */
    .nav-active { color: #34d399 !important; border-bottom: 2px solid #34d399; }

    /* Card hover */
    .card-hover { transition: transform 0.2s ease, box-shadow 0.2s ease; }
    .card-hover:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.4); }

    /* Number input arrows hidden */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">

  <!-- Navbar -->
  <nav class="bg-gray-800 border-b border-gray-700 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4">
      <div class="flex items-center justify-between h-16">
        <!-- Logo -->
        <a href="/" class="flex items-center gap-2 text-xl font-bold text-brand-400">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M13 10V3L4 14h7v7l9-11h-7z"/>
          </svg>
          <span>FitTracker</span>
        </a>

        <!-- Desktop nav -->
        <div class="hidden md:flex items-center gap-1">
          <a href="/" class="nav-link px-4 py-2 rounded-lg text-sm font-medium text-gray-300 hover:text-brand-400 hover:bg-gray-700 transition-colors">
            Dashboard
          </a>
          <a href="/log" class="nav-link px-4 py-2 rounded-lg text-sm font-medium text-gray-300 hover:text-brand-400 hover:bg-gray-700 transition-colors">
            Registrar
          </a>
          <a href="/history" class="nav-link px-4 py-2 rounded-lg text-sm font-medium text-gray-300 hover:text-brand-400 hover:bg-gray-700 transition-colors">
            Historial
          </a>
          <a href="/profile" class="nav-link px-4 py-2 rounded-lg text-sm font-medium text-gray-300 hover:text-brand-400 hover:bg-gray-700 transition-colors">
            Perfil
          </a>
        </div>

        <!-- Mobile hamburger -->
        <button id="menu-btn" class="md:hidden p-2 rounded-lg text-gray-400 hover:text-white hover:bg-gray-700 transition-colors">
          <svg class="w-6 h-6" id="icon-open" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
          <svg class="w-6 h-6 hidden" id="icon-close" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Mobile menu -->
    <div id="mobile-menu" class="hidden md:hidden border-t border-gray-700 bg-gray-800">
      <div class="px-4 py-3 space-y-1">
        <a href="/" class="nav-link block px-3 py-2 rounded-lg text-sm font-medium text-gray-300 hover:text-brand-400 hover:bg-gray-700 transition-colors">
          📊 Dashboard
        </a>
        <a href="/log" class="nav-link block px-3 py-2 rounded-lg text-sm font-medium text-gray-300 hover:text-brand-400 hover:bg-gray-700 transition-colors">
          ➕ Registrar
        </a>
        <a href="/history" class="nav-link block px-3 py-2 rounded-lg text-sm font-medium text-gray-300 hover:text-brand-400 hover:bg-gray-700 transition-colors">
          📅 Historial
        </a>
        <a href="/profile" class="nav-link block px-3 py-2 rounded-lg text-sm font-medium text-gray-300 hover:text-brand-400 hover:bg-gray-700 transition-colors">
          👤 Perfil
        </a>
      </div>
    </div>
  </nav>

  <!-- Main content -->
  <main class="flex-1 max-w-6xl mx-auto w-full px-4 py-6">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="bg-gray-800 border-t border-gray-700 mt-auto">
    <div class="max-w-6xl mx-auto px-4 py-4 text-center text-sm text-gray-500">
      FitTracker &mdash; Tu compañero de entrenamiento
    </div>
  </footer>

  <script>
    // Mobile menu toggle
    const menuBtn = document.getElementById('menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    const iconOpen = document.getElementById('icon-open');
    const iconClose = document.getElementById('icon-close');

    menuBtn.addEventListener('click', () => {
      mobileMenu.classList.toggle('hidden');
      iconOpen.classList.toggle('hidden');
      iconClose.classList.toggle('hidden');
    });

    // Highlight active nav link
    const currentPath = window.location.pathname;
    document.querySelectorAll('.nav-link').forEach(link => {
      const href = link.getAttribute('href');
      if (href === currentPath || (href !== '/' && currentPath.startsWith(href))) {
        link.classList.add('text-brand-400');
        if (!link.classList.contains('block')) {
          link.classList.add('nav-active');
        }
      }
    });
  </script>

  {% block scripts %}{% endblock %}
</body>
</html>
