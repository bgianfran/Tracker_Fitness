<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#065f46;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="fGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a7f3d0;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="100" ry="100" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Subtle inner highlight -->
  <rect x="20" y="20" width="472" height="230" rx="80" ry="80" fill="white" opacity="0.05"/>

  <!-- Lightning bolt accent (background decoration) -->
  <path d="M340 80 L290 230 L320 230 L270 400 L390 200 L355 200 L410 80 Z"
        fill="white" opacity="0.08"/>

  <!-- Letter F -->
  <text x="145" y="340"
        font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
        font-weight="900"
        font-size="280"
        fill="url(#fGrad)"
        filter="url(#glow)"
        letter-spacing="-10">F</text>

  <!-- Bottom label: Buggie -->
  <rect x="80" y="400" width="352" height="72" rx="36" fill="white" opacity="0.15"/>
  <text x="256" y="452"
        font-family="'Arial Rounded MT Bold', 'Helvetica Neue', Arial, sans-serif"
        font-weight="700"
        font-size="52"
        fill="white"
        text-anchor="middle"
        letter-spacing="6">BUGGIE</text>
</svg>
